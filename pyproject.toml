[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfactory-cloud"
version = "0.1.0"
description = "AgentFactory creator intake, local development profile"
requires-python = ">=3.11"
dependencies = ["agent-factory-orchestrator[web] @ git+https://github.com/HappyMiha/AgentFactory.git@60e7895940359fdcf7ea32e4d38f7d6d5e3e97ed"]

[project.scripts]
agentfactory-brief = "agentfactory_cloud.brief_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentfactory_cloud = ["static/*"]
